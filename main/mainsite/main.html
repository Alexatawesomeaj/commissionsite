<script>
    const buttonUp = document.getElementById("upButton");
    const buttonDown = document.getElementById("downButton");

    const stage0 = document.getElementById("headerImage");
    const stage1 = document.getElementById("stage1");
    const stage2 = document.getElementById("stage2");

    var userLocation = 0;
    var canGoUp = false;
    var canGoDown = true;

    history.scrollRestoration = "manual";

    window.onbeforeunload = function() {
        window.scrollTo(0, 0);
    }

    function startPage() {
        scrollPage("down");
    }
    
    function scrollPage(direction) {
        const locations = [stage0, stage1, stage2];

        if (direction == "up") {
            if (canGoUp) {
                canGoUp = false;
                userLocation --;
                if (userLocation < 0) {userLocation = 0;}
            }
        } 
        if (direction == "down") {
            if (canGoDown) {
                canGoDown = false;
                userLocation ++;
                if (userLocation > locations.length - 1) {userLocation = locations.length -1;}
            }
        }

        locations[userLocation].scrollIntoView({block: "center"});
        if (userLocation > 0) {
            canGoUp = true;

        }
        if (userLocation < locations.length - 1) {
            canGoDown = true;
        }
        if (userLocation == 0) {
            disappearButton('up');
            disappearButton('down');
        } else if (userLocation == locations.length - 1) {
            disappearButton('down');
            appearButton('up');
        } else {
            appearButton('up');
            appearButton('down');
        }
    }

    function disappearButton(type) {
        if (type == 'up') {
            buttonUp.classList.remove('fadeIn');
            buttonUp.classList.remove('fadeOut');
            buttonUp.classList.add('fadeOut');

            makeFullyInvisible('upButton');
        }
        if (type == 'down') {
            buttonDown.classList.remove('fadeIn');
            buttonDown.classList.remove('fadeOut');
            buttonDown.classList.add('fadeOut');

            makeFullyInvisible('downButton');
        }
    }

    function appearButton(type) {
        if (type == 'up') {
            buttonUp.classList.remove('fadeIn');
            buttonUp.classList.remove('fadeOut');
            buttonUp.classList.add('fadeIn');

            makeFullyVisable('upButton');
        }
        if (type == 'down') {
            buttonDown.classList.remove('fadeIn');
            buttonDown.classList.remove('fadeOut');
            buttonDown.classList.add('fadeIn');

            makeFullyVisable('downButton');
        }
    }

    function makeFullyVisable(item) {
        var a = document.getElementById(item);
        a.style.opacity = 100;
    }

    function makeFullyInvisible(item) {
        var a = document.getElementById(item);
        a.style.opacity = 0;
    }

    function temp() {
        console.log("you clicked something");
    }

    let imageIndex = 0;
    showSlides();

    function showSlides() {
        let i =1;
        let slides = document.getElementsByClassName("mySlides");
        for (i = 0; i < slides.length; i++) {
            slides[i].style.display = "none";

        }

        imageIndex ++;
        if (imageIndex > slides.length) {
            imageIndex = 1
        }

        slides[imageIndex-1].style.display = "block";
        setTimeout(showSlides, 5000);
    }
</script>
